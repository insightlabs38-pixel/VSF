<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Varifold</title>
</head>
<body>
<main>
<h1>Varifold</h1>
<p id="origin"></p>
<button id="authorize" type="button">Authorize this site</button>
<button id="capture" type="button">Capture</button>
<button id="transform" type="button">Transform</button>
<button id="restore" type="button">Show original</button>
<p><input id="service" type="text" aria-label="Companion address" placeholder="http://127.0.0.1:port" autocomplete="off">
<input id="code" type="text" aria-label="Pairing code" autocomplete="off" maxlength="16">
<button id="pair" type="button">Pair</button>
<button id="finish" type="button">Finish pairing</button>
<button id="unpair" type="button">Unpair</button></p>
<output id="result"></output>
</main>
<script type="module" src="panel.js"></script>
</body>
</html>
