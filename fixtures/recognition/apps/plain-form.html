<!doctype html>
<html lang="en"><head><title>Customer profile</title></head><body>
<main>
  <h1>Customer profile</h1>
  <form id="profile" aria-label="Customer profile">
    <label for="fn">First name</label><input id="fn" name="first" required>
    <label for="ln">Last name</label><input id="ln" name="last">
    <label>Email <input type="email" name="email"></label>
    <div><label for="country">Country</label><select id="country"><option>Spain</option><option>France</option></select></div>
    <fieldset><legend>Newsletter</legend><label><input type="checkbox" name="news"> Weekly digest</label></fieldset>
    <textarea id="notes" aria-label="Notes"></textarea>
    <button type="submit">Save changes</button>
    <button type="button">Cancel</button>
  </form>
</main>
</body></html>
